<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo App</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <header class="header">
        <h1 class="title">Todo</h1>
        <p class="subtitle">오늘 할 일을 정리해보세요</p>
      </header>

      <!-- 주간 뷰 -->
      <div class="week-nav">
        <button id="prevWeekBtn" class="week-nav-btn" aria-label="이전 주">&#8249;</button>
        <div class="week-days" id="weekDays"></div>
        <button id="nextWeekBtn" class="week-nav-btn" aria-label="다음 주">&#8250;</button>
      </div>

      <!-- 일간 날짜 네비게이션 -->
      <div class="date-nav">
        <button id="prevDateBtn" class="date-nav-btn" aria-label="이전 날짜">&#8249;</button>
        <div class="date-display">
          <span id="currentDateLabel" class="date-label"></span>
          <span id="todayBadge" class="today-badge hidden">오늘</span>
        </div>
        <button id="nextDateBtn" class="date-nav-btn" aria-label="다음 날짜">&#8250;</button>
      </div>

      <!-- 할 일 입력 영역 -->
      <section class="input-section">
        <div class="input-wrapper">
          <input
            type="text"
            id="todoInput"
            class="todo-input"
            placeholder="할 일을 입력하세요..."
            maxlength="100"
          />
          <button id="addBtn" class="add-btn">추가</button>
        </div>
        <!-- 입력값 비어있을 때 안내 메시지 -->
        <p id="errorMsg" class="error-msg hidden">할 일을 입력해주세요.</p>
      </section>

      <!-- 통계 영역 -->
      <div class="stats">
        <span id="totalCount">전체 <strong>0</strong></span>
        <span id="doneCount">완료 <strong>0</strong></span>
      </div>

      <!-- 상태별 필터 탭 -->
      <div class="filter-tabs" id="filterTabs">
        <button class="filter-tab active" data-filter="all">전체</button>
        <button class="filter-tab" data-filter="active">진행 중</button>
        <button class="filter-tab" data-filter="completed">완료</button>
      </div>

      <!-- 할 일 목록 영역 -->
      <ul id="todoList" class="todo-list"></ul>

      <!-- 할 일이 없을 때 빈 상태 메시지 -->
      <div id="emptyState" class="empty-state">
        <p id="emptyStateMsg">아직 할 일이 없어요.</p>
        <p>위에서 새로운 할 일을 추가해보세요!</p>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
